name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go test ./... -race -coverprofile=coverage.out -coverpkg=./...
        env:
          YOUTUBE_API_KEY: test-key
      - run: go tool cover -func=coverage.out



